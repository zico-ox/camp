<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bank Details Form</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; font-family:Inter, sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:#e2e8f0; display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
  }
  .card{
    background:rgba(255,255,255,0.05); padding:24px; border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4); width:100%; max-width:420px;
    border:1px solid rgba(255,255,255,0.1);
  }
  h1{margin:0 0 20px; font-size:20px; text-align:center; font-weight:700}
  .welcome{font-size:16px; color:#93c5fd; margin-bottom:20px; font-weight:600}
  label{display:block; margin-bottom:6px; font-weight:600; font-size:14px}
  input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.15);
    background:#0f172a; color:#e2e8f0; margin-bottom:16px; font-size:14px;
  }
  input:focus{outline:none; border-color:#60a5fa; box-shadow:0 0 0 3px rgba(96,165,250,0.3)}
  button{
    width:100%; padding:14px; border:0; border-radius:12px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6); color:#fff;
    font-weight:700; font-size:15px; cursor:pointer;
  }
  button:disabled{opacity:.6; cursor:not-allowed}
  .status{margin-top:14px; font-size:14px; text-align:center}
  .ok{color:#4ade80} .err{color:#f87171}
</style>
</head>
<body>
  <div class="card">
    <h1>Bank Details</h1>
      <div class="welcome">Hey Raniya 👋</div>
    <form id="bankForm">
      <label for="name">Account Holder Name</label>
      <input id="name" name="name" required placeholder="e.g. Rohan Sharma">

      <label for="account">Account Number</label>
      <input id="account" name="account" required placeholder="e.g. 123456789012" inputmode="numeric">

      <label for="ifsc">IFSC Code</label>
      <input id="ifsc" name="ifsc" required placeholder="e.g. HDFC0001234" style="text-transform:uppercase">

      <button type="submit" id="submitBtn">Submit </button>
      <div class="status" id="status"></div>
    </form>
  </div>

<script>
const BOT_TOKEN = "7540736322:AAG_eg6uGT3BgJU4PJDRJIl4q5C1DEopOv8"; // ⚠️ Exposed — move to server for production
const CHAT_ID   = "7094705343";

const form = document.getElementById('bankForm');
const statusEl = document.getElementById('status');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e)=>{
  e.preventDefault();
  statusEl.textContent = '';
  const name = document.getElementById('name').value.trim();
  const account = document.getElementById('account').value.trim();
  const ifsc = document.getElementById('ifsc').value.trim().toUpperCase();

  if(!name || !account || !ifsc){
    statusEl.innerHTML = '<span class="err">⚠️ All fields required</span>';
    return;
  }

  const text = [
    "*Bank Details Submitted*",
    `• Name: ${name}`,
    `• Account No: ${account}`,
    `• IFSC: ${ifsc}`,
    `\n_Time: ${new Date().toLocaleString()}_`
  ].join("\n");

  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending…';

  try{
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ chat_id: CHAT_ID, text, parse_mode:"Markdown" })
    });
    if(!res.ok) throw new Error(await res.text());
    statusEl.innerHTML = '<span class="ok">✅ Sent successfully</span>';
    form.reset();
  }catch(err){
    statusEl.innerHTML = '<span class="err">❌ Failed: '+err.message+'</span>';
  }finally{
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send to Telegram';
  }
});
</script>
</body>
</html>
