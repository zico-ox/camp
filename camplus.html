<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome Offer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                  url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      backdrop-filter: blur(10px);
      max-width: 500px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .intro-text {
      font-size: 16px;
      color: #ddd;
      margin-bottom: 15px;
    }

    .container h1 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .container p {
      font-size: 18px;
      margin-bottom: 30px;
      color: #eee;
    }

    .cta-button {
      background: #00c6ff;
      background: linear-gradient(to right, #0072ff, #00c6ff);
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 50px;
      color: #fff;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .cta-button:hover {
      background: linear-gradient(to right, #0052cc, #0099cc);
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      color: black;
      padding: 25px 40px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: none;
      z-index: 10;
      text-align: center;
    }

    .popup button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #333;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .popup button:hover {
      background: #555;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="intro-text">
      🔥 <strong>Introducing Reward Central:</strong> Your gateway to limited-time gifts and exclusive online deals!
    </div>
    <h1>Welcome to Camplus Campaign </h1>
    <p>Start your journey to exclusive rewards, offers, and giveaways!</p>
    <button class="cta-button" onclick="showPopup()">Get Started</button>
  </div>

  <!-- Popup Message -->
  <div class="overlay" id="overlay"></div>
  <div class="popup" id="popup">
    <h2>No Offers Available</h2>
    <p>Currently, there are no offers available at the moment. Please check back later.</p>
    <button onclick="closePopup()">OK</button>
  </div>

  <script>
    function showPopup() {
      document.getElementById('popup').style.display = 'block';
      document.getElementById('overlay').style.display = 'block';
    }

    function closePopup() {
      document.getElementById('popup').style.display = 'none';
      document.getElementById('overlay').style.display = 'none';
    }
  </script>

</body>
</html>
