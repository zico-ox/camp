<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome Back Faaizy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
    }

    .header {
      background-color: #2c3e50;
      color: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background-color: #34495e;
      color: white;
      transition: left 0.3s ease;
      z-index: 1000;
      padding-top: 60px;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-menu {
      list-style: none;
      padding: 20px;
    }

    .sidebar-menu li {
      margin-bottom: 15px;
      padding: 10px;
      border-bottom: 1px solid #44586a;
      cursor: pointer;
    }

    .sidebar-menu li:hover {
      background-color: #44586a;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: none;
    }

    .overlay.active {
      display: block;
    }

    .main-content {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .add-card-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .add-card-form input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      flex-grow: 1;
      font-size: 16px;
    }

    .add-card-form button {
      padding: 10px 20px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: flex-start;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 15px;
      width: 350px;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .card p {
      font-size: 16px;
      color: #333;
      word-wrap: break-word;
    }

    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background-color: #e74c3c;
      color: white;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <div class="main-content">
    <div class="add-card-form">
      <input type="text" id="cardInput" placeholder="Enter something...">
      <button id="addCardBtn">Add</button>
    </div>

    <div class="card-container" id="cardContainer"></div>
  </div>

  <div class="overlay"></div>

  <script>
    // Load shared header/sidebar
    fetch('header.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;

        document.querySelector('.menu-btn').addEventListener('click', () => {
          document.querySelector('.sidebar').classList.toggle('open');
          document.querySelector('.overlay').classList.toggle('active');
        });

        document.querySelector('.overlay').addEventListener('click', () => {
          document.querySelector('.sidebar').classList.remove('open');
          document.querySelector('.overlay').classList.remove('active');
        });
      });

    document.addEventListener('DOMContentLoaded', function () {
      const cardInput = document.getElementById('cardInput');
      const addCardBtn = document.getElementById('addCardBtn');
      const cardContainer = document.getElementById('cardContainer');

      loadCards();

      addCardBtn.addEventListener('click', addCard);
      cardInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') addCard();
      });

      function addCard() {
        const text = cardInput.value.trim();
        if (text === '') return;

        const newCard = {
          id: 'card-' + Date.now(),
          text: text
        };

        const cards = getCardsFromStorage();
        cards.unshift(newCard); // Add to the top
        saveCardsToStorage(cards);
        renderAllCards(cards);
        cardInput.value = '';
      }

      function renderAllCards(cards) {
        cardContainer.innerHTML = '';
        cards.forEach(renderCard);
      }

      function renderCard(cardData) {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = cardData.id;
        card.innerHTML = `
          <button class="delete-btn" onclick="deleteCard('${cardData.id}')">×</button>
          <p>${cardData.text}</p>
        `;
        cardContainer.appendChild(card);
      }

      function loadCards() {
        const cards = getCardsFromStorage();
        renderAllCards(cards);
      }

      function getCardsFromStorage() {
        return JSON.parse(localStorage.getItem('cards_v2')) || [];
      }

      function saveCardsToStorage(cards) {
        localStorage.setItem('cards_v2', JSON.stringify(cards));
      }

      window.deleteCard = function (cardId) {
  const confirmDelete = confirm("Are you sure you want to delete this item?");
  if (!confirmDelete) return;

  const cards = getCardsFromStorage().filter(card => card.id !== cardId);
  saveCardsToStorage(cards);
  renderAllCards(cards);
};
    });
  </script>
</body>
</html>
