<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome Back Faaizy</title>
  <style>
    /* (Same CSS as before, unchanged) */
    /* You can paste your original CSS here */
  </style>
</head>
<body>
  <div id="header-container"></div>

  <div class="main-content">
    <div class="add-card-form">
      <input type="text" id="cardInput" placeholder="Enter something...">
      <button id="addCardBtn">Add</button>
    </div>
    <div class="card-container" id="cardContainer"></div>
  </div>

  <div class="overlay"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyB8mlQK0s0myUHGZJrbtRRHChJorea2Tsc",
      authDomain: "faaizy-738f0.firebaseapp.com",
      databaseURL: "https://faaizy-738f0-default-rtdb.firebaseio.com",
      projectId: "faaizy-738f0",
      storageBucket: "faaizy-738f0.appspot.com",
      messagingSenderId: "896828206030",
      appId: "1:896828206030:web:f86fcea23793ef806a199f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const cardsRef = ref(db, 'cards');

    const cardInput = document.getElementById('cardInput');
    const addCardBtn = document.getElementById('addCardBtn');
    const cardContainer = document.getElementById('cardContainer');

    // Load sidebar/header
    fetch('header.html')
      .then(res => res.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
        document.querySelector('.menu-btn').addEventListener('click', () => {
          document.querySelector('.sidebar').classList.toggle('open');
          document.querySelector('.overlay').classList.toggle('active');
        });
        document.querySelector('.overlay').addEventListener('click', () => {
          document.querySelector('.sidebar').classList.remove('open');
          document.querySelector('.overlay').classList.remove('active');
        });
      });

    // Add new card
    addCardBtn.addEventListener('click', addCard);
    cardInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addCard();
    });

    function addCard() {
      const text = cardInput.value.trim();
      if (!text) return;
      const newCard = { text };
      push(cardsRef, newCard);
      cardInput.value = '';
    }

    // Display cards in real-time
    onValue(cardsRef, snapshot => {
      const cards = snapshot.val() || {};
      cardContainer.innerHTML = '';
      Object.entries(cards).reverse().forEach(([id, data]) => renderCard(id, data));
    });

    function renderCard(id, data) {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = id;
      card.innerHTML = `
        <button class="delete-btn" onclick="deleteCard('${id}')">×</button>
        <p>${data.text}</p>
      `;
      cardContainer.appendChild(card);
    }

    // Make deleteCard globally accessible
    window.deleteCard = function(id) {
      if (confirm("Are you sure you want to delete this item?")) {
        remove(ref(db, `cards/${id}`));
      }
    };
  </script>
</body>
</html>
